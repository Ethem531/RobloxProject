<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070d">
<title>Roblox Game Lookup</title>
<style>
*{box-sizing:border-box}
:root{--blue:#398cff;--bg:#05070d;--panel:#090e19;--border:rgba(75,145,255,.22);--muted:#8291a8}
html{scroll-behavior:smooth;min-height:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
#cursorGlow{position:fixed;width:300px;height:300px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(35,130,255,.13),transparent 68%);z-index:0}
.grid{position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:linear-gradient(rgba(50,110,190,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(50,110,190,.1) 1px,transparent 1px);background-size:48px 48px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
button{border:0;border-radius:12px;padding:0 21px;min-height:46px;color:#fff;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#2786ff,#1557cf);transition:.2s}
button:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:not-allowed}
input{min-width:0;width:100%;height:48px;padding:0 15px;color:#fff;background:#080d18;border:1px solid #263955;border-radius:11px;outline:none;font-size:14px}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(57,140,255,.13)}
input::placeholder{color:#64748b}
.sidebar{position:fixed;z-index:10;inset:0 auto 0 0;width:250px;padding:24px 16px;background:rgba(8,13,24,.97);border-right:1px solid var(--border);backdrop-filter:blur(20px);transition:width .3s}
.sidebar.collapsed{width:76px}
.sidebar-header{margin-bottom:38px;padding:0 7px}
.brand{font-size:16px;font-weight:bold;color:#b9d9ff;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:9px}
.nav-item{display:flex;align-items:center;gap:14px;width:100%;min-height:46px;padding:12px;border:1px solid transparent;border-radius:11px;background:transparent;color:#8d9bb0;text-align:left;white-space:nowrap}
.nav-item:hover,.nav-item.active{background:rgba(57,140,255,.11);border-color:rgba(57,140,255,.2);color:#70b0ff}
.nav-icon{width:22px;flex-shrink:0;text-align:center}
.toggle{position:fixed;z-index:11;bottom:22px;left:250px;width:22px;height:40px;min-height:0;padding:0;background:#101b2c;border:1px solid #263955;border-left:0;border-radius:0 9px 9px 0;color:#8d9bb0;transition:left .3s}
.sidebar.collapsed+.toggle{left:76px}
.sidebar.collapsed .brand,.sidebar.collapsed .nav-text,.sidebar.collapsed .status-text{display:none}
.status-box{position:absolute;bottom:22px;left:13px;right:13px;padding:13px;background:#0d1727;border:1px solid #233650;border-radius:12px;overflow:hidden;font-size:12px;color:#8e9db5}
.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#35d68b;margin-right:8px}
.content{position:relative;z-index:1;margin-left:250px;min-height:100vh;padding:55px 30px 40px;display:flex;flex-direction:column;align-items:center;gap:25px;transition:margin-left .3s}
.content.expanded{margin-left:76px}
.panel{width:min(92vw,600px);padding:38px 32px;text-align:center;border:1px solid var(--border);border-radius:24px;background:rgba(9,14,25,.94);box-shadow:0 24px 90px rgba(0,0,0,.55)}
.eyebrow{color:#68aaff;font-size:11px;font-weight:bold;letter-spacing:.25em;text-transform:uppercase}
h1{margin:8px 0 0;font-weight:850;background:linear-gradient(100deg,#fff,#9bcaff,#398cff,#9bcaff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-size:clamp(36px,8vw,54px);letter-spacing:-.055em}
.subtitle{margin:13px 0 25px;color:#8e9db5;font-size:14px}
form{display:flex;gap:10px}
.hint{margin-top:18px;color:#52627a;font-size:11px}
.result{display:none;margin-top:18px;padding:16px;text-align:left;border:1px solid #263955;border-radius:13px;background:#080e1b}
.result p{margin:0;color:#b8c7dc;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.result a{display:inline-block;margin-top:12px;color:#8fc4ff;font-size:13px;font-weight:bold}
.account-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(92vw,600px)}
.small-panel{padding:22px;text-align:left;border:1px solid var(--border);border-radius:18px;background:rgba(9,14,25,.94)}
.small-panel h2{margin:0 0 8px;font-size:17px}
.small-panel p{margin:0 0 13px;color:#8291a8;font-size:12px;line-height:1.5}
.small-panel input{margin-bottom:9px}
.account-stat{font-size:13px;color:#b9d9ff}
#accountId{overflow-wrap:anywhere;color:#7187a3;font-size:10px;margin-top:8px}
.error{color:#ff9292!important}.success{color:#6ee7ad!important}
@media(max-width:700px){.sidebar{width:76px;padding:18px 9px}.sidebar .brand,.sidebar .nav-text,.sidebar .status-text{display:none}.sidebar .status-box{left:7px;right:7px;padding:9px 3px;text-align:center}.sidebar .status-dot{margin:0}.toggle{display:none}.content,.content.expanded{margin-left:76px;padding:35px 10px 25px}.panel{padding:30px 18px}.account-row{grid-template-columns:1fr}form{flex-direction:column}form button{width:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="cursorGlow"></div><div class="grid"></div><canvas id="fx"></canvas>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="brand">GAME LOOKUP</div></div>
  <nav class="nav"><button class="nav-item active" data-target="home"><span class="nav-icon">⌂</span><span class="nav-text">Home</span></button></nav>
  <div class="status-box"><span class="status-dot"></span><span class="status-text">Status: <strong id="accountStatus">Connecting…</strong></span></div>
</aside>
<button class="toggle" id="toggleSidebar" aria-label="Collapse sidebar">‹</button>
<div class="content" id="content">
  <main id="home" class="panel">
    <p class="eyebrow">Roblox utility</p>
    <h1>Game Lookup</h1>
    <p class="subtitle">Enter a Roblox game ID to find its file.</p>
    <form id="lookupForm">
      <input id="gameId" type="text" inputmode="numeric" autocomplete="off" placeholder="Enter Roblox game ID" required>
      <button type="submit" id="searchButton">Search</button>
    </form>
    <section id="result" class="result" aria-live="polite"><p id="status"></p><a id="downloadLink" href="#" target="_blank" rel="noopener noreferrer" hidden>Download file ↗</a></section>
    <p class="hint">Press Enter to search</p>
  </main>
  <div class="account-row">
    <section class="small-panel">
      <h2>Your account</h2>
      <p id="usageText">Loading account information…</p>
      <div class="account-stat" id="premiumStatus">Checking access…</div>
      <div id="accountId"></div>
    </section>
    <section class="small-panel">
      <h2>Redeem premium</h2>
      <p>Enter a valid access code to activate 30 days of premium access.</p>
      <form id="redeemForm" style="display:block">
        <input id="accessCode" type="text" autocomplete="off" placeholder="Enter access code" required>
        <button type="submit" id="redeemButton" style="width:100%">Redeem code</button>
      </form>
      <p id="redeemStatus" style="margin-top:10px"></p>
    </section>
  </div>
</div>
<script>
(() => {
  "use strict";
  const API_URL = "https://copier.edgar69-help.workers.dev";
  const TOKEN_KEY = "gameLookupAccountToken";

  const $ = id => document.getElementById(id);
  const form = $("lookupForm"), input = $("gameId"), searchButton = $("searchButton");
  const result = $("result"), statusText = $("status"), downloadLink = $("downloadLink");
  const usageText = $("usageText"), premiumStatus = $("premiumStatus"), accountId = $("accountId");
  let accountToken = localStorage.getItem(TOKEN_KEY) || "";
  let accountInfo = null;

  function showResult(message, kind = "info", link = "") {
    result.style.display = "block";
    statusText.textContent = message;
    statusText.className = kind === "error" ? "error" : kind === "success" ? "success" : "";
    downloadLink.hidden = !link;
    if (link) downloadLink.href = link;
  }

  async function api(path, options = {}) {
    const headers = new Headers(options.headers || {});
    if (accountToken) headers.set("Authorization", "Bearer " + accountToken);
    if (options.body) headers.set("Content-Type", "application/json");
    const response = await fetch(API_URL + path, {...options, headers});
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const error = new Error(data.error || "Request failed (" + response.status + ")");
      error.status = response.status;
      error.data = data;
      throw error;
    }
    return data;
  }

  async function createOrLoadAccount() {
    if (accountToken) {
      try {
        accountInfo = await api("/api/me");
        return;
      } catch (error) {
        if (error.status !== 401) throw error;
        localStorage.removeItem(TOKEN_KEY);
        accountToken = "";
      }
    }
    const created = await api("/api/account", {method:"POST"});
    if (!created.token) throw new Error("The server did not return an account token.");
    accountToken = created.token;
    localStorage.setItem(TOKEN_KEY, accountToken);
    accountInfo = await api("/api/me");
  }

  function renderAccount() {
    if (!accountInfo) return;
    $("accountStatus").textContent = "Online";
    usageText.textContent = accountInfo.premium
      ? "Premium access is active."
      : (accountInfo.free_remaining + " of 3 free searches remaining this month.");
    premiumStatus.textContent = accountInfo.premium ? "Premium active" : "Free account";
    premiumStatus.className = accountInfo.premium ? "account-stat success" : "account-stat";
    accountId.textContent = "Account: " + accountInfo.account_id;
  }

  async function refreshAccount() {
    accountInfo = await api("/api/me");
    renderAccount();
  }

  $("toggleSidebar").addEventListener("click", () => {
    $("sidebar").classList.toggle("collapsed");
    $("content").classList.toggle("expanded");
  });

  form.addEventListener("submit", async event => {
    event.preventDefault();
    const id = input.value.trim();
    if (!/^\d{1,30}$/.test(id)) {
      showResult("Please enter a valid numeric game ID.", "error");
      return;
    }
    searchButton.disabled = true;
    searchButton.textContent = "Searching…";
    downloadLink.hidden = true;
    showResult("Searching Discord and checking storage…");
    try {
      const data = await api("/lookup?id=" + encodeURIComponent(id));
      if (data.download_url) {
        showResult("File found. Your download is ready.", "success", data.download_url);
        // Trigger the signed download URL in a separate tab.
        window.open(data.download_url, "_blank", "noopener");
      } else if (data.gofile_url) {
        showResult("Found the file on Gofile. Open it below.", "success", data.gofile_url);
      } else {
        showResult("The server did not return a download link.", "error");
      }
      await refreshAccount();
    } catch (error) {
      showResult(error.message || "Could not connect to the lookup server.", "error");
      try { await refreshAccount(); } catch {}
    } finally {
      searchButton.disabled = false;
      searchButton.textContent = "Search";
    }
  });

  $("redeemForm").addEventListener("submit", async event => {
    event.preventDefault();
    const code = $("accessCode").value.trim();
    const button = $("redeemButton");
    const message = $("redeemStatus");
    if (!code) return;
    button.disabled = true;
    message.className = "";
    message.textContent = "Checking code…";
    try {
      await api("/api/redeem", {method:"POST", body:JSON.stringify({code})});
      message.textContent = "Premium activated for 30 days.";
      message.className = "success";
      $("accessCode").value = "";
      await refreshAccount();
    } catch (error) {
      message.textContent = error.message;
      message.className = "error";
    } finally {
      button.disabled = false;
    }
  });

  // Cursor glow.
  const glow = $("cursorGlow");
  addEventListener("pointermove", event => {
    glow.style.left = event.clientX + "px";
    glow.style.top = event.clientY + "px";
  });

  // Lightweight animated particle background.
  const canvas = $("fx"), ctx = canvas.getContext("2d");
  let width = 0, height = 0, particles = [];
  function resize() {
    width = canvas.width = innerWidth;
    height = canvas.height = innerHeight;
    const count = Math.min(65, Math.floor(width * height / 26000));
    particles = Array.from({length:count}, () => ({
      x:Math.random()*width, y:Math.random()*height,
      vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35,
      r:Math.random()*1.2+.5
    }));
  }
  function draw() {
    ctx.clearRect(0,0,width,height);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fill();
    }
    for (let i=0;i<particles.length;i++) for (let j=i+1;j<particles.length;j++) {
      const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
      const d=Math.hypot(dx,dy);
      if (d<125) {
        ctx.strokeStyle=`rgba(150,200,255,${(1-d/125)*.16})`;
        ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.stroke();
      }
    }
    requestAnimationFrame(draw);
  }
  addEventListener("resize", resize);
  resize(); draw();

  createOrLoadAccount().then(() => renderAccount()).catch(error => {
    $("accountStatus").textContent = "Offline";
    usageText.textContent = error.message || "Could not load account.";
    premiumStatus.textContent = "Account unavailable";
  });
})();
</script>
</body>
</html>
