<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Game Lookup</title>

<style>
* { box-sizing: border-box; }

:root {
    --blue: #398cff;
    --bg: #05070d;
    --panel: #090e19;
    --border: rgba(75,145,255,.22);
    --muted: #8291a8;
}

html { scroll-behavior: smooth; overflow-y: auto; }

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
}

#cursorGlow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle,rgba(35,130,255,.13),transparent 68%);
    z-index: 0;
}

.grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .2;
    background-image:
        linear-gradient(rgba(50,110,190,.1) 1px,transparent 1px),
        linear-gradient(90deg,rgba(50,110,190,.1) 1px,transparent 1px);
    background-size: 48px 48px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 0 21px;
    min-height: 48px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(135deg,#2786ff,#1557cf);
    transition: .2s;
}

button:hover { filter: brightness(1.12); }
button:disabled { opacity: .5; cursor: not-allowed; }

svg { display: block; }

/* SIDEBAR */

.sidebar {
    position: fixed;
    z-index: 10;
    inset: 0 auto 0 0;
    width: 250px;
    padding: 24px 16px;
    background: rgba(8,13,24,.97);
    border-right: 1px solid var(--border);
    backdrop-filter: blur(20px);
    transition: width .3s;
}

.sidebar.collapsed { width: 76px; }

.sidebar-header {
    margin-bottom: 38px;
    padding: 0 7px;
}

.brand {
    font-size: 16px;
    font-weight: bold;
    color: #b9d9ff;
    white-space: nowrap;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 46px;
    padding: 12px;
    border: 1px solid transparent;
    border-radius: 11px;
    background: transparent;
    color: #8d9bb0;
    text-align: left;
    white-space: nowrap;
}

.nav-item:hover,
.nav-item.active {
    background: rgba(57,140,255,.11);
    border-color: rgba(57,140,255,.2);
    color: #70b0ff;
}

.nav-icon {
    width: 22px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
}

.toggle {
    position: fixed;
    z-index: 11;
    bottom: 22px;
    left: 250px;
    width: 22px;
    height: 40px;
    min-height: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101b2c;
    border: 1px solid #263955;
    border-left: 0;
    border-radius: 0 9px 9px 0;
    color: #8d9bb0;
    transition: left .3s, filter .2s;
}

.toggle svg { transition: transform .3s; }
.sidebar.collapsed + .toggle { left: 76px; }
.sidebar.collapsed + .toggle svg { transform: rotate(180deg); }

.status-box {
    position: absolute;
    bottom: 22px;
    left: 13px;
    right: 13px;
    padding: 13px;
    background: #0d1727;
    border: 1px solid #233650;
    border-radius: 12px;
    overflow: hidden;
    font-size: 12px;
    color: #8e9db5;
}

.status-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #64748b;
    margin-right: 8px;
}

.status-box.premium .status-dot { background: #35d68b; }

.status-main { color: #cfe0f5; font-weight: bold; }

.status-days {
    display: none;
    margin-top: 8px;
    color: #42dc9c;
}

.status-box.premium .status-days { display: block; }

.sidebar.collapsed .brand,
.sidebar.collapsed .nav-text,
.sidebar.collapsed .status-text,
.sidebar.collapsed .status-days {
    display: none;
}

.sidebar.collapsed .status-box { text-align: center; }
.sidebar.collapsed .status-dot { margin: 0; }

/* CONTENT */

.content {
    position: relative;
    z-index: 1;
    margin-left: 250px;
    min-height: 100vh;
    padding: 60px 30px 30px;
    gap: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: margin-left .3s;
}

.content.expanded { margin-left: 76px; }

main, .panel {
    width: min(92vw,560px);
    padding: 45px 34px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: rgba(9,14,25,.94);
    box-shadow: 0 24px 90px rgba(0,0,0,.55);
}

.eyebrow {
    color: #68aaff;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: .25em;
    text-transform: uppercase;
}

h1 {
    margin: 0;
    font-size: clamp(36px,8vw,54px);
    letter-spacing: -.055em;
    font-weight: 850;
    background: linear-gradient(100deg,white,#9bcaff,#398cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.subtitle {
    margin: 13px 0 30px;
    color: #8e9db5;
    font-size: 14px;
}

form {
    display: flex;
    gap: 10px;
}

input {
    min-width: 0;
    flex: 1;
    height: 52px;
    padding: 0 17px;
    color: white;
    background: #080d18;
    border: 1px solid #263955;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(57,140,255,.13);
}

input::placeholder { color: #64748b; }

.hint {
    margin-top: 20px;
    color: #52627a;
    font-size: 11px;
}

#result {
    display: none;
    margin-top: 20px;
    padding: 17px;
    text-align: left;
    border: 1px solid #263955;
    border-radius: 13px;
    background: #080e1b;
}

#status {
    color: #b8c7dc;
    font-size: 13px;
    line-height: 1.5;
}

#openLink {
    display: none;
    text-decoration: none;
    text-align: center;
}

/* LOCK */

.locked-input {
    position: relative;
    flex: 1;
    min-width: 0;
}

.locked-input input { width: 100%; }

.upgrade-overlay {
    display: none;
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: rgba(5,10,20,.96);
    align-items: center;
    justify-content: center;
    color: #70b0ff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    border: 1px solid #29466c;
}

.upgrade-overlay.visible { display: flex; }

.usage-text {
    color: #64748b;
    font-size: 11px;
    margin-top: 12px;
}

.usage-text:empty { display: none; }

/* DIVIDER */

.divider {
    position: relative;
    flex-shrink: 0;
    width: 2px;
    height: 220px;
    background: linear-gradient(transparent,rgba(255,255,255,.55),transparent);
}

.divider i {
    position: absolute;
    top: 0;
    left: calc(var(--x) * 1px);
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 6px rgba(255,255,255,.85);
    opacity: 0;
    animation: drift var(--t) linear infinite;
    animation-delay: var(--d);
}

@keyframes drift {
    0%   { transform: translateY(0); opacity: 0; }
    20%  { opacity: .9; }
    80%  { opacity: .9; }
    100% { transform: translateY(220px); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
    .divider i { animation: none; }
}

/* ACCESS PAGE */

#codeStatus {
    font-size: 13px;
    margin: 16px 0 0;
    color: #9aabc1;
}

#codeStatus:empty { display: none; }

/* DISCORD SECTION */

#fullAccess {
    width: min(92vw,560px);
    margin: 0 0 50px;
    padding: 45px 25px;
    text-align: center;
    background: rgba(9,14,25,.95);
    border: 1px solid var(--border);
    border-radius: 22px;
    scroll-margin-top: 30px;
}

#fullAccess h2 {
    font-size: 23px;
    margin: 0 0 12px;
}

#fullAccess p {
    font-size: 13px;
    color: #8192aa;
}

.discord-button {
    display: inline-flex;
    margin-top: 18px;
    padding: 14px 25px;
    text-decoration: none;
    border-radius: 11px;
    background: linear-gradient(135deg,#2786ff,#1557cf);
    color: white;
    font-size: 14px;
    font-weight: bold;
}

.type-here {
    margin-top: 13px !important;
    color: #526b8b !important;
    font-size: 10px !important;
    letter-spacing: .2em;
    font-weight: bold;
}

@media(max-width:650px) {
    .toggle { display: none; }

    .sidebar {
        width: 76px;
        padding: 18px 9px;
    }

    .sidebar .brand,
    .sidebar .nav-text,
    .sidebar .status-text,
    .sidebar .status-days {
        display: none;
    }

    .sidebar .status-box {
        left: 7px;
        right: 7px;
        padding: 9px 3px;
        text-align: center;
    }

    .sidebar .status-dot { margin: 0; }

    .content,
    .content.expanded {
        margin-left: 76px;
        padding: 40px 10px 20px;
    }

    main, .panel { padding: 35px 20px; }

    form { flex-direction: column; }
    form button { width: 100%; }

    #fullAccess { padding: 35px 15px; }
}
</style>
</head>

<body>

<div id="cursorGlow"></div>
<div class="grid"></div>

<aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
        <div class="brand">GAME LOOKUP</div>
    </div>

    <nav class="nav">

        <button class="nav-item active" data-target="home">
            <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>
            </span>
            <span class="nav-text">Home</span>
        </button>

        <button class="nav-item" data-target="access">
            <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg>
            </span>
            <span class="nav-text">Access Code</span>
        </button>

        <button class="nav-item" data-target="upgrade">
            <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg>
            </span>
            <span class="nav-text">Get Full Access</span>
        </button>

    </nav>

    <div class="status-box" id="statusBox">
        <span class="status-dot"></span>
        <span class="status-text">Status: <span class="status-main" id="accountStatus">Loading...</span></span>
        <div class="status-days" id="accountDays"></div>
    </div>

</aside>

<button class="toggle" id="toggleSidebar" aria-label="Collapse or expand sidebar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</button>

<div class="content" id="content">

    <main id="homePage">

        <p class="eyebrow">Roblox utility</p>

        <h1>Game Lookup</h1>

        <p class="subtitle">
            Searching for game and getting the file...
        </p>

        <form id="lookupForm">

            <div class="locked-input">

                <input
                    id="gameId"
                    type="text"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="Enter Roblox game ID"
                    required
                >

                <div class="upgrade-overlay" id="upgradeOverlay">
                    Upgrade
                </div>

            </div>

            <button type="submit" id="searchButton">Search</button>

        </form>

        <div class="usage-text" id="usageText"></div>

        <section id="result" aria-live="polite">
            <p id="status"></p>

            <a id="openLink"
               href="#"
               target="_blank"
               rel="noopener noreferrer">
                <button type="button">Open link</button>
            </a>
        </section>

        <p class="hint">Press Enter to search</p>

    </main>

    <div class="divider" aria-hidden="true"><i style="--x:-30;--t:5s;--d:0s"></i><i style="--x:-18;--t:4s;--d:-1.5s"></i><i style="--x:-8;--t:6s;--d:-3s"></i><i style="--x:0;--t:4.5s;--d:-0.8s"></i><i style="--x:9;--t:5.5s;--d:-2.2s"></i><i style="--x:19;--t:4s;--d:-3.6s"></i><i style="--x:31;--t:6s;--d:-1.1s"></i></div>

    <section class="panel" id="accessPage">

        <form id="codeForm">

            <input
                id="accessCodeInput"
                type="text"
                placeholder="Enter your access code"
                autocomplete="off"
                required
            >

            <button type="submit" id="redeemButton">Redeem</button>

        </form>

        <p id="codeStatus"></p>

    </section>

    <div class="divider" aria-hidden="true"><i style="--x:-30;--t:5s;--d:0s"></i><i style="--x:-18;--t:4s;--d:-1.5s"></i><i style="--x:-8;--t:6s;--d:-3s"></i><i style="--x:0;--t:4.5s;--d:-0.8s"></i><i style="--x:9;--t:5.5s;--d:-2.2s"></i><i style="--x:19;--t:4s;--d:-3.6s"></i><i style="--x:31;--t:6s;--d:-1.1s"></i></div>

    <section id="fullAccess">

        <p class="eyebrow">Unlock everything</p>

        <h2>Join the discord for full access</h2>

        <p>Get an access code to unlock unlimited searches.</p>

        <!-- CHANGE THIS TO YOUR DISCORD INVITE -->

        <a class="discord-button"
           href="https://discord.com/"
           target="_blank"
           rel="noopener noreferrer">
            Join Discord
        </a>

        <p class="type-here">TYPE HERE</p>

    </section>

</div>

<script>

/* CONFIGURATION */

const API_URL = "https://copier.edgar69-help.workers.dev";

/* ACCOUNT */

let accountToken = localStorage.getItem("lookup_token");
let accountData = null;

const gameInput = document.getElementById("gameId");
const searchButton = document.getElementById("searchButton");
const upgradeOverlay = document.getElementById("upgradeOverlay");

const result = document.getElementById("result");
const statusText = document.getElementById("status");
const openLink = document.getElementById("openLink");

/* API CONNECTION */

async function api(path, options = {}) {

    const response = await fetch(API_URL + path, {
        ...options,
        headers: {
            ...(accountToken
                ? { "Authorization": "Bearer " + accountToken }
                : {}),
            ...(options.body
                ? { "Content-Type": "application/json" }
                : {}),
            ...(options.headers || {})
        }
    });

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.error || "Request failed");
    }

    return data;
}

/* ACCOUNT CREATION */

async function initializeAccount() {

    try {

        if (!accountToken) {

            const data = await api("/api/account", {
                method: "POST"
            });

            accountToken = data.token;

            localStorage.setItem("lookup_token", accountToken);
        }

        try {

            accountData = await api("/api/me");

        } catch (error) {

            if (error.message === "Unauthorized") {

                localStorage.removeItem("lookup_token");
                accountToken = null;

                const data = await api("/api/account", {
                    method: "POST"
                });

                accountToken = data.token;

                localStorage.setItem("lookup_token", accountToken);

                accountData = await api("/api/me");

            } else {
                throw error;
            }
        }

        updateInterface();

    } catch (error) {

        document.getElementById("accountStatus").textContent =
            "Offline";

        document.getElementById("usageText").textContent =
            "Could not connect to the server. Refresh to retry.";

        console.error(error);
    }
}

/* ACCOUNT DISPLAY */

function updateInterface() {

    if (!accountData) return;

    const premium = accountData.premium;

    document.getElementById("accountStatus").textContent =
        premium ? "Premium" : "Free";

    document.getElementById("statusBox")
        .classList.toggle("premium", !!premium);

    const locked =
        !premium && accountData.free_remaining <= 0;

    gameInput.disabled = locked;
    searchButton.disabled = locked;

    upgradeOverlay.classList.toggle("visible", locked);

    document.getElementById("usageText").textContent =
        locked ? "You used your 3 free searches this month. Upgrade to continue." : "";

    updateExpiry();
}

/* PREMIUM TIMER */

function updateExpiry() {

    const days = document.getElementById("accountDays");

    if (!accountData || !accountData.premium) {
        days.textContent = "";
        return;
    }

    const remaining =
        Math.max(0, accountData.premium_until - Date.now());

    if (remaining <= 0) {
        refreshAccount();
        return;
    }

    const left = Math.ceil(remaining / 86400000);

    days.textContent =
        left + (left === 1 ? " day left" : " days left");
}

async function refreshAccount() {

    try {
        accountData = await api("/api/me");
        updateInterface();
    } catch (error) {
        console.error(error);
    }
}

/* NAVIGATION */

const sidebar = document.getElementById("sidebar");
const content = document.getElementById("content");

document.getElementById("toggleSidebar").addEventListener("click", () => {

    sidebar.classList.toggle("collapsed");
    content.classList.toggle("expanded");

});

const sections = {
    home: document.getElementById("homePage"),
    access: document.getElementById("accessPage"),
    upgrade: document.getElementById("fullAccess")
};

function scrollToSection(name) {

    sections[name].scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}

document.querySelectorAll(".nav-item[data-target]").forEach(item => {

    item.addEventListener("click", () => scrollToSection(item.dataset.target));

});

function updateActive() {

    const middle = window.innerHeight / 2;
    let current = "home";
    let best = Infinity;

    for (const name in sections) {

        const rect = sections[name].getBoundingClientRect();
        const distance = Math.abs((rect.top + rect.bottom) / 2 - middle);

        if (distance < best) {
            best = distance;
            current = name;
        }
    }

    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) {
        current = "upgrade";
    }

    document.querySelectorAll(".nav-item[data-target]").forEach(item => {
        item.classList.toggle("active", item.dataset.target === current);
    });

}

window.addEventListener("scroll", updateActive, { passive: true });
window.addEventListener("resize", updateActive);
updateActive();

upgradeOverlay.addEventListener("click", () => scrollToSection("upgrade"));

/* REDEEM CODE */

document.getElementById("codeForm").addEventListener("submit", async event => {

    event.preventDefault();

    const input = document.getElementById("accessCodeInput");
    const message = document.getElementById("codeStatus");
    const button = document.getElementById("redeemButton");

    button.disabled = true;
    message.textContent = "Checking code...";
    message.style.color = "#9aabc1";

    try {

        await api("/api/redeem", {
            method: "POST",
            body: JSON.stringify({
                code: input.value.trim()
            })
        });

        message.style.color = "#42dc9c";
        message.textContent =
            "Premium activated! You have 30 days of unlimited access.";

        input.value = "";

        await refreshAccount();

    } catch (error) {

        message.style.color = "#ff7777";
        message.textContent = error.message;

    } finally {

        button.disabled = false;

    }

});

/* GAME LOOKUP */

document.getElementById("lookupForm").addEventListener("submit", async event => {

    event.preventDefault();

    if (!accountData) return;

    const id = gameInput.value.trim();

    result.style.display = "block";
    openLink.style.display = "none";

    if (!/^\d+$/.test(id)) {

        statusText.textContent = "Please enter a game ID.";
        return;
    }

    searchButton.disabled = true;
    statusText.textContent = "Searching for game...";

    try {

        const data = await api(
            "/lookup?id=" + encodeURIComponent(id)
        );

        statusText.textContent =
            `File successfully sended, game ID ${id}.`;

        openLink.href = data.gofile_url;
        openLink.style.display = "block";

    } catch (error) {

        statusText.textContent = error.message;

    } finally {

        await refreshAccount();

    }

});

/* CURSOR GLOW */

const glow = document.getElementById("cursorGlow");

window.addEventListener("pointermove", event => {

    glow.style.left = event.clientX + "px";
    glow.style.top = event.clientY + "px";

});

/* CLICK RIPPLE */

window.addEventListener("pointerdown", event => {

    const ripple = document.createElement("span");

    ripple.style.cssText = `
        position:fixed;
        left:${event.clientX}px;
        top:${event.clientY}px;
        width:12px;
        height:12px;
        border:1px solid white;
        border-radius:50%;
        pointer-events:none;
        transform:translate(-50%,-50%);
        animation:ripple .55s ease-out forwards;
        z-index:100;
    `;

    const style = document.createElement("style");
    style.textContent = `
        @keyframes ripple {
            to {
                width:95px;
                height:95px;
                opacity:0;
            }
        }
    `;

    document.head.appendChild(style);
    document.body.appendChild(ripple);

    ripple.addEventListener("animationend", () => {
        ripple.remove();
        style.remove();
    });

});

/* START */

initializeAccount();

setInterval(() => {
    updateExpiry();
}, 30000);

</script>

</body>
</html>
