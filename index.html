<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Game Lookup</title>

<style>
* { box-sizing: border-box; }

:root {
    --blue: #398cff;
    --bg: #05070d;
    --panel: #090e19;
    --border: rgba(75,145,255,.22);
    --muted: #8291a8;
}

html { scroll-behavior: smooth; overflow-y: auto; }

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
}

#cursorGlow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle,rgba(35,130,255,.13),transparent 68%);
    z-index: 0;
}

.grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .2;
    background-image:
        linear-gradient(rgba(50,110,190,.1) 1px,transparent 1px),
        linear-gradient(90deg,rgba(50,110,190,.1) 1px,transparent 1px);
    background-size: 48px 48px;
}

#fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 0 21px;
    min-height: 48px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(135deg,#2786ff,#1557cf);
    transition: .2s;
}

button:hover { filter: brightness(1.12); }
button:disabled { opacity: .5; cursor: not-allowed; }

/* button shine */
form button, .discord-button {
    position: relative;
    overflow: hidden;
}

form button::after, .discord-button::after {
    content: "";
    position: absolute;
    top: 0;
    left: -80%;
    width: 50%;
    height: 100%;
    background: linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
    transform: skewX(-20deg);
    transition: left .6s;
    pointer-events: none;
}

form button:hover::after, .discord-button:hover::after {
    left: 130%;
}

svg { display: block; }

/* SIDEBAR */
.sidebar {
    position: fixed;
    z-index: 10;
    inset: 0 auto 0 0;
    width: 250px;
    padding: 24px 16px;
    background: rgba(8,13,24,.97);
    border-right: 1px solid var(--border);
    backdrop-filter: blur(20px);
    transition: width .3s;
}

.sidebar.collapsed { width: 76px; }

.sidebar-header {
    margin-bottom: 38px;
    padding: 0 7px;
}

.brand {
    font-size: 16px;
    font-weight: bold;
    color: #b9d9ff;
    white-space: nowrap;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 46px;
    padding: 12px;
    border: 1px solid transparent;
    border-radius: 11px;
    background: transparent;
    color: #8d9bb0;
    text-align: left;
    white-space: nowrap;
}

.nav-item:hover, .nav-item.active {
    background: rgba(57,140,255,.11);
    border-color: rgba(57,140,255,.2);
    color: #70b0ff;
}

.nav-item:hover { transform: translateX(3px); }

.nav-icon {
    width: 22px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
}

.toggle {
    position: fixed;
    z-index: 11;
    bottom: 22px;
    left: 250px;
    width: 22px;
    height: 40px;
    min-height: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101b2c;
    border: 1px solid #263955;
    border-left: 0;
    border-radius: 0 9px 9px 0;
    color: #8d9bb0;
    transition: left .3s, filter .2s;
}

.toggle svg { transition: transform .3s; }
.sidebar.collapsed + .toggle { left: 76px; }
.sidebar.collapsed + .toggle svg { transform: rotate(180deg); }

.status-box {
    position: absolute;
    bottom: 22px;
    left: 13px;
    right: 13px;
    padding: 13px;
    background: #0d1727;
    border: 1px solid #233650;
    border-radius: 12px;
    overflow: hidden;
    font-size: 12px;
    color: #8e9db5;
}

.status-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #35d68b;
    margin-right: 8px;
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(53,214,139,.5); }
    50%      { box-shadow: 0 0 0 6px rgba(53,214,139,0); }
}

.status-main { color: #cfe0f5; font-weight: bold; }

.sidebar.collapsed .brand,
.sidebar.collapsed .nav-text,
.sidebar.collapsed .status-text {
    display: none;
}

.sidebar.collapsed .status-box { text-align: center; }
.sidebar.collapsed .status-dot { margin: 0; }

/* CONTENT */
.content {
    position: relative;
    z-index: 1;
    margin-left: 250px;
    min-height: 100vh;
    padding: 60px 30px 30px;
    gap: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: margin-left .3s;
}

.content.expanded { margin-left: 76px; }

main, .panel {
    width: min(92vw,560px);
    padding: 45px 34px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: rgba(9,14,25,.94);
    box-shadow: 0 24px 90px rgba(0,0,0,.55);
}

.reveal {
    opacity: 0;
    transform: translateY(46px) scale(.98);
    transition: opacity .8s ease, transform .6s ease, border-color .3s, box-shadow .3s;
}

.reveal.in {
    opacity: 1;
    transform: none;
}

.reveal.in:hover {
    transform: translateY(-4px);
    border-color: rgba(90,160,255,.5);
    box-shadow: 0 24px 90px rgba(0,0,0,.55), 0 0 46px rgba(57,140,255,.14);
}

.eyebrow {
    color: #68aaff;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: .25em;
    text-transform: uppercase;
}

h1 {
    margin: 0;
    font-weight: 850;
    background: linear-gradient(100deg,white,#9bcaff,#398cff,#9bcaff);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s ease-in-out infinite alternate;
    font-size: clamp(36px,8vw,54px);
    letter-spacing: -.055em;
}

@keyframes shimmer {
    from { background-position: 0% 50%; }
    to   { background-position: 100% 50%; }
}

.subtitle {
    margin: 13px 0 30px;
    color: #8e9db5;
    font-size: 14px;
}

form {
    display: flex;
    gap: 10px;
}

input {
    min-width: 0;
    flex: 1;
    height: 52px;
    padding: 0 17px;
    color: white;
    background: #080d18;
    border: 1px solid #263955;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(57,140,255,.13);
}

input::placeholder { color: #64748b; }

.hint {
    margin-top: 20px;
    color: #52627a;
    font-size: 11px;
}

#result {
    display: none;
    margin-top: 20px;
    padding: 17px;
    text-align: left;
    border: 1px solid #263955;
    border-radius: 13px;
    background: #080e1b;
}

#status {
    color: #b8c7dc;
    font-size: 13px;
    line-height: 1.5;
}

#openLink {
    display: none;
    text-decoration: none;
    text-align: center;
}

/* DIVIDER */
.divider {
    position: relative;
    flex-shrink: 0;
    width: 2px;
    height: 220px;
    background: linear-gradient(transparent,rgba(255,255,255,.55),transparent);
}

.divider i {
    position: absolute;
    top: 0;
    left: calc(var(--x) * 1px);
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 6px rgba(255,255,255,.85);
    opacity: 0;
    animation: drift var(--t) linear infinite;
    animation-delay: var(--d);
}

@keyframes drift {
    0%   { transform: translateY(0); opacity: 0; }
    20%  { opacity: .9; }
    80%  { opacity: .9; }
    100% { transform: translateY(220px); opacity: 0; }
}

/* DISCORD SECTION */
#fullAccess {
    width: min(92vw,560px);
    margin: 0 0 50px;
    padding: 45px 25px;
    text-align: center;
    background: rgba(9,14,25,.95);
    border: 1px solid var(--border);
    border-radius: 22px;
    scroll-margin-top: 30px;
}

#fullAccess h2 {
    font-size: 23px;
    margin: 0 0 12px;
}

#fullAccess p {
    font-size: 13px;
    color: #8192aa;
}

.discord-button {
    display: inline-flex;
    margin-top: 18px;
    padding: 14px 25px;
    text-decoration: none;
    border-radius: 11px;
    background: linear-gradient(135deg,#2786ff,#1557cf);
    color: white;
    font-size: 14px;
    font-weight: bold;
}

.type-here {
    margin-top: 13px !important;
    color: #526b8b !important;
    font-size: 10px !important;
    letter-spacing: .2em;
    font-weight: bold;
}

@media(max-width:650px) {
    .toggle { display: none; }
    .sidebar { width: 76px; padding: 18px 9px; }
    .sidebar .brand, .sidebar .nav-text, .sidebar .status-text { display: none; }
    .sidebar .status-box { left: 7px; right: 7px; padding: 9px 3px; text-align: center; }
    .sidebar .status-dot { margin: 0; }
    .content, .content.expanded { margin-left: 76px; padding: 40px 10px 20px; }
    main, .panel { padding: 35px 20px; }
    form { flex-direction: column; }
    form button { width: 100%; }
    #fullAccess { padding: 35px 15px; }
}
</style>
</head>

<body>

<div id="cursorGlow"></div>
<div class="grid"></div>
<canvas id="fx"></canvas>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="brand">GAME LOOKUP</div>
    </div>

    <nav class="nav">
        <button class="nav-item active" data-target="home">
            <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>
            </span>
            <span class="nav-text">Home</span>
        </button>
    </nav>

    <div class="status-box" id="statusBox">
        <span class="status-dot"></span>
        <span class="status-text">Status: <span class="status-main" id="accountStatus">Online</span></span>
    </div>
</aside>

<button class="toggle" id="toggleSidebar" aria-label="Collapse or expand sidebar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</button>

<div class="content" id="content">

    <main id="homePage" class="reveal in">
        <p class="eyebrow">Roblox utility</p>
        <h1>Game Lookup</h1>
        <p class="subtitle">
            Searching for game and getting the file...
        </p>

        <form id="lookupForm">
            <input
                id="gameId"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Enter Roblox game ID"
                required
            >
            <button type="submit" id="searchButton">Search</button>
        </form>

        <section id="result" aria-live="polite">
            <p id="status"></p>
            <a id="openLink" href="#" target="_blank" rel="noopener noreferrer">
                <button type="button">Click here to download</button>
            </a>
        </section>

        <p class="hint">Press Enter to search</p>
    </main>

    <div class="divider" aria-hidden="true"><i style="--x:-30;--t:5s;--d:0s"></i><i style="--x:-18;--t:4s;--d:-1.5s"></i><i style="--x:-8;--t:6s;--d:-3s"></i><i style="--x:0;--t:4.5s;--d:-0.8s"></i><i style="--x:9;--t:5.5s;--d:-2.2s"></i><i style="--x:19;--t:4s;--d:-3.6s"></i><i style="--x:31;--t:6s;--d:-1.1s"></i></div>

    <section id="fullAccess" class="reveal in">
        <h2>Join the discord for full access</h2>
        <a class="discord-button" href="https://discord.com/" target="_blank" rel="noopener noreferrer">
            Join Discord
        </a>
        <p class="type-here">TYPE HERE</p>
    </section>

</div>

<script>
/* =========================================
   CONFIGURATION
   ========================================= */
const API_URL = "https://copier.edgar69-help.workers.dev";

const gameInput = document.getElementById("gameId");
const searchButton = document.getElementById("searchButton");
const result = document.getElementById("result");
const statusText = document.getElementById("status");
const openLink = document.getElementById("openLink");

/* =========================================
   NAVIGATION & UI
   ========================================= */
const sidebar = document.getElementById("sidebar");
const content = document.getElementById("content");

document.getElementById("toggleSidebar").addEventListener("click", () => {
    sidebar.classList.toggle("collapsed");
    content.classList.toggle("expanded");
});

/* =========================================
   SEARCH & AUTO DOWNLOAD
   ========================================= */
document.getElementById("lookupForm").addEventListener("submit", async event => {
    event.preventDefault();

    const id = gameInput.value.trim();
    result.style.display = "block";
    openLink.style.display = "none";

    if (!/^\d+$/.test(id)) {
        statusText.textContent = "Please enter a valid numeric game ID.";
        return;
    }

    searchButton.disabled = true;
    statusText.textContent = "Searching for the file, please wait...";

    try {
        // Because the Cloudflare Worker streams the file directly, 
        // we just need to redirect to the API URL to trigger the download.
        const downloadUrl = `${API_URL}/lookup?id=${encodeURIComponent(id)}`;
        
        // Auto trigger download
        window.location.href = downloadUrl;

        // Show status update
        statusText.textContent = `Download started for game ID ${id}. If it didn't start, click the button below.`;
        
        openLink.href = downloadUrl;
        openLink.style.display = "block";

    } catch (error) {
        statusText.textContent = "Error connecting to the server. Try again.";
    } finally {
        searchButton.disabled = false;
    }
});

/* =========================================
   BACKGROUND EFFECTS (PARTICLES / CURSOR)
   ========================================= */
const glow = document.getElementById("cursorGlow");
window.addEventListener("pointermove", event => {
    glow.style.left = event.clientX + "px";
    glow.style.top = event.clientY + "px";
});

// Particle background
(function particles() {
    const canvas = document.getElementById("fx");
    const c = canvas.getContext("2d");
    let W = 0, H = 0, pts = [];

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        const count = Math.min(75, Math.floor(W * H / 24000));
        pts = Array.from({ length: count }, () => ({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: (Math.random() - .5) * .45,
            vy: (Math.random() - .5) * .45,
            r: Math.random() * 1.3 + .7
        }));
    }

    function draw() {
        c.clearRect(0, 0, W, H);
        for (const p of pts) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > W) p.vx *= -1;
            if (p.y < 0 || p.y > H) p.vy *= -1;
            c.beginPath();
            c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            c.fillStyle = "rgba(255,255,255,.6)";
            c.fill();
        }
        for (let i = 0; i < pts.length; i++) {
            for (let j = i + 1; j < pts.length; j++) {
                const dx = pts[i].x - pts[j].x;
                const dy = pts[i].y - pts[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 130) {
                    c.strokeStyle = `rgba(150,200,255,${(1 - dist / 130) * .22})`;
                    c.beginPath();
                    c.moveTo(pts[i].x, pts[i].y);
                    c.lineTo(pts[j].x, pts[j].y);
                    c.stroke();
                }
            }
        }
        requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);
    resize();
    draw();
})();
</script>

</body>
</html>
