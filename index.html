
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Game Lookup</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #05070d;
    color: white;
    font-family: Arial, sans-serif;
}

#cursorGlow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(35,130,255,.13), transparent 68%);
}

.grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .2;
    background-image:
        linear-gradient(rgba(50,110,190,.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(50,110,190,.1) 1px, transparent 1px);
    background-size: 48px 48px;
}

main {
    position: relative;
    width: min(92vw, 560px);
    padding: 48px 34px 34px;
    text-align: center;
    border: 1px solid rgba(75,145,255,.22);
    border-radius: 24px;
    background: rgba(9,14,25,.92);
    box-shadow: 0 24px 90px rgba(0,0,0,.55);
}

.eyebrow {
    color: #68aaff;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: .25em;
    text-transform: uppercase;
}

h1 {
    margin: 0;
    font-size: clamp(36px, 8vw, 54px);
    letter-spacing: -.055em;
    font-weight: 850;
    background: linear-gradient(100deg, white, #9bcaff, #398cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.subtitle {
    margin: 13px 0 30px;
    color: #8e9db5;
    font-size: 14px;
}

form {
    display: flex;
    gap: 10px;
}

input {
    min-width: 0;
    flex: 1;
    height: 52px;
    padding: 0 17px;
    color: white;
    background: #080d18;
    border: 1px solid #263955;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #398cff;
    box-shadow: 0 0 0 3px rgba(57,140,255,.13);
}

input::placeholder { color: #64748b; }

button {
    border: 0;
    border-radius: 12px;
    padding: 0 21px;
    min-height: 52px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(135deg, #2786ff, #1557cf);
}

button:hover {
    filter: brightness(1.12);
    transform: translateY(-1px);
}

#result {
    display: none;
    margin-top: 20px;
    padding: 17px;
    text-align: left;
    border: 1px solid #263955;
    border-radius: 13px;
    background: #080e1b;
}

#status {
    color: #b8c7dc;
    font-size: 13px;
    line-height: 1.5;
}

#openLink {
    display: none;
    text-decoration: none;
    text-align: center;
}

.hint {
    margin-top: 20px;
    color: #52627a;
    font-size: 11px;
}

.ripple {
    position: fixed;
    width: 12px;
    height: 12px;
    border: 1px solid white;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: ripple .55s ease-out forwards;
}

@keyframes ripple {
    to {
        width: 95px;
        height: 95px;
        opacity: 0;
    }
}

@media (max-width: 480px) {
    main { padding: 38px 20px 26px; }
    form { flex-direction: column; }
    button { width: 100%; }
}
</style>
</head>

<body>

<div id="cursorGlow"></div>
<div class="grid"></div>

<main>
    <p class="eyebrow">Roblox utility</p>

    <h1>Game Lookup</h1>

    <p class="subtitle">
        Searching for game and getting the file...
    </p>

    <form id="lookupForm">
        <input
            id="gameId"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Enter Roblox game ID"
            required
        >
        <button type="submit">Search</button>
    </form>

    <section id="result" aria-live="polite">
        <p id="status"></p>

        <a
            id="openLink"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            <button type="button">Open link</button>
        </a>
    </section>

    <p class="hint">Press Enter to search</p>
</main>

<script>
const form = document.getElementById("lookupForm");
const input = document.getElementById("gameId");
const result = document.getElementById("result");
const statusText = document.getElementById("status");
const openLink = document.getElementById("openLink");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const id = input.value.trim();

    result.style.display = "block";
    openLink.style.display = "none";

    if (!/^\d+$/.test(id)) {
        statusText.textContent = "Please enter a game ID";
        return;
    }

    statusText.textContent = "Searching...";

    // PASTE YOUR TUNNEL URL HERE
    const TUNNEL_URL = "https://copier.edgar69-help.workers.dev"; 

    statusText.textContent = "Searching for game...";
    
    try {
        const response = await fetch(`${TUNNEL_URL}/lookup?id=${id}`);
        const data = await response.json();

        if (!response.ok) {
            statusText.textContent = data.error || `No record found for ID ${id}.`;
            return;
        }

        statusText.textContent = `File successfully sended, game ID ${id}.`;
        openLink.href = data.gofile_url;
        openLink.style.display = "block";
        
    } catch (error) {
        statusText.textContent = "Error connecting to the server. Please try again.";
    }
});

// White cursor glow
const glow = document.getElementById("cursorGlow");

window.addEventListener("pointermove", event => {
    glow.style.left = event.clientX + "px";
    glow.style.top = event.clientY + "px";
});

// Click ripple
window.addEventListener("pointerdown", event => {
    const ripple = document.createElement("span");

    ripple.className = "ripple";
    ripple.style.left = event.clientX + "px";
    ripple.style.top = event.clientY + "px";

    document.body.appendChild(ripple);

    ripple.addEventListener("animationend", () => {
        ripple.remove();
    });
});
</script>

</body>
</html>
